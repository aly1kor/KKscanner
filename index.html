<div class="container">

    <div id="home">

        <button id="scanModeBtn" class="menuButton">
            📷 Scan QR Code
        </button>

        <div class="orText">OR</div>

        <button id="manualModeBtn" class="menuButton">
            ⌨ Manual Check-In
        </button>

    </div>


    <div id="scannerArea" class="hidden">

        <div id="reader"></div>

    </div>


    <div id="manualArea" class="hidden">

        <input
            type="text"
            id="searchText"
            placeholder="Registration ID / Email / Name / Token">

        <button id="lookupBtn">
            Lookup Registration
        </button>

    </div>


    <div id="status" class="status">
        Select a check-in method
    </div>


    <div id="details" class="hidden">

        <h2 id="name"></h2>

        <div class="regid" id="regid"></div>

        <div class="bands">

            <span id="bandsCount">0</span>

            <div class="label">
                WRISTBANDS
            </div>

        </div>

        <div class="counts">

            <div>
                Adults :
                <strong id="adults"></strong>
            </div>

            <div>
                Children :
                <strong id="children"></strong>
            </div>

        </div>

        <button id="confirmBtn">
            Confirm Check-In
        </button>

    </div>

</div>
