<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>xPressIn</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

</head>

<body>

<header>

    <div id="branding">
    <img src="logo.png" alt="xPressIn">
</div>

</header>


    <div id="topBar" class="hidden">

    <button id="backBtn" class="backButton">
        ← Home
    </button>

</div>
    
<div class="container">

    <div id="home">

<button id="scanModeBtn" class="menuButton">
    Scan QR Code
</button>

        <div class="orText">
            OR
        </div>

<button id="manualModeBtn" class="menuButton">
    Manual Check-In
</button>

    </div>


    <div id="scannerArea" class="hidden">

        <div id="reader"></div>

    </div>


    <div id="manualArea" class="hidden">

        <input
            type="text"
            id="searchText"
            placeholder="Registration ID / Email / Name / Token">

        <button id="lookupBtn">
            Lookup Registration
        </button>

    </div>


    <div id="status" class="status">

        Select Scan or Manual Check-In

    </div>
<div id="searchResults" class="hidden">

</div>

    <div id="details" class="hidden">

        <h2 id="name"></h2>

        <div id="regid" class="regid"></div>

        <div class="bands">

            <span id="bandsCount">0</span>

            <div class="label">
                WRISTBANDS
            </div>

        </div>

        <div class="counts">

            <div>

                Adults :
                <strong id="adults"></strong>

            </div>

            <div>

                Children :
                <strong id="children"></strong>

            </div>

        </div>

        <button id="confirmBtn">

            Confirm Check-In

        </button>

    </div>

<div id="debugPanel" class="hidden">

<hr>

<b>Diagnostics</b><br>

Client :
<span id="dbgClient"></span><br>

Worker :
<span id="dbgWorker"></span><br>

Server :
<span id="dbgServer"></span><br>

Deployment :
<span id="dbgDeployment"></span><br>

Rows :
<span id="dbgRows"></span><br>

Browser Time :
<span id="dbgTime"></span> ms<br>

Worker Time :
<span id="dbgWorkerTime"></span> ms<br>

Server Time :
<span id="dbgServerTime"></span> ms

</div>

</div>

<script src="scanner.js?v=20260804"></script>

</body>

</html>
